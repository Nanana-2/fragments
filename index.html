<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fragments</title>

  <!-- OGP / メタデータ -->
  <meta name="description" content="文字を追いたい。怒りは見たくない。古い言葉だけが流れ続けるタイムライン。">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fragments | 文字を浴びるタイムライン">
  <meta property="og:description" content="文字を追いたい。怒りは見たくない。古い言葉だけが流れ続けるタイムライン。">
  <meta property="og:image" content="/ogp.png">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fragments | 文字を浴びるタイムライン">
  <meta name="twitter:description" content="文字を追いたい。怒りは見たくない。古い言葉だけが流れ続けるタイムライン。">
  <meta name="twitter:image" content="/ogp.png">

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" id="theme-color-meta">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f1419;
      --sub: #536471;
      --border: #eff3f4;
      --like: #f91880;
      --avatar-bg: #e1e8ed;
      --avatar-text: #0f1419;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --text: #e7e9ea;
      --sub: #71767b;
      --border: #2f3336;
      --like: #f91880;
      --avatar-bg: #202327;
      --avatar-text: #e7e9ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    header {
      position: sticky;
      top: 0;
      background-color: var(--bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 6px 16px;
    }

    .brand-title {
      appearance: none;
      border: 0;
      background: none;
      color: var(--text);
      font-family: var(--font);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
      cursor: pointer;
      padding: 4px 0;
    }

    .theme-toggle-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tabs {
      display: flex;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 14.5px;
      font-weight: 500;
      color: var(--sub);
      cursor: pointer;
      position: relative;
    }

    .tab-btn.active {
      font-weight: 700;
      color: var(--text);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 3px;
      background-color: var(--text);
      border-radius: 2px;
    }

    #pull-indicator {
      width: 100%;
      height: 0px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--sub);
      transition: height 0.2s ease;
    }

    .post {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .post-avatar {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--avatar-bg);
      color: var(--avatar-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      user-select: none;
      overflow: hidden;
    }

    .post-avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: grayscale(1);
    }

    .post-content {
      flex: 1;
      min-width: 0;
    }

    .post-meta {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .author-name {
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .work-handle, .post-time {
      color: var(--sub);
      font-size: 13.5px;
      white-space: nowrap;
    }

    .meta-dot {
      color: var(--sub);
      font-size: 12px;
    }

    .post-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 4px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      transition: color 0.15s ease;
    }

    .action-btn:hover {
      color: var(--text);
    }

    .action-btn.liked {
      color: var(--like);
    }

    .action-btn.liked svg {
      fill: var(--like);
      stroke: var(--like);
    }

    .empty-state {
      padding: 4rem 1.5rem;
      text-align: center;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      .app-container {
        border-left: none;
        border-right: none;
      }
      .post {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-top">
        <button class="brand-title" id="brandRefreshBtn" aria-label="タイムラインを更新">Fragments</button>
        <button class="theme-toggle-btn" id="themeBtn" aria-label="テーマ切替">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path><path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path><path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" id="tabFeed">タイムライン</button>
        <button class="tab-btn" id="tabLikes">保存済み</button>
      </nav>
    </header>

    <div id="pull-indicator">引っ張って更新</div>
    <main id="postFeed"></main>
  </div>

  <script>
    // 1. 安全なストレージラッパー（ローカルファイル実行時等の例外防止）
    const storage = {
      data: {},
      getItem(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (e) {
          return this.data[key] || null;
        }
      },
      setItem(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch (e) {
          this.data[key] = String(value);
        }
      }
    };

    // 2. 内蔵フォールバックデータ（quotes.json 未配置時でも即座に動作）
    const fallbackData = [
      {
        id: "fallback_takuboku_01", author: "石川啄木", work: "一握の砂", year: "1910年", tone: "gold",
        text: "東海の小島の磯の白砂に\nわれ泣きぬれて\n蟹とたはむる"
      },
      {
        id: "fallback_hosai_01", author: "尾崎放哉", work: "尾崎放哉選句集", year: "1926年", tone: "gold",
        text: "たつた一人になりきつて夕空"
      },
      {
        id: "fallback_santoka_01", author: "種田山頭火", work: "草木塔", year: "1940年", tone: "gold",
        text: "あるけばきんぽうげすわればきんぽうげ"
      },
      {
        id: "fallback_akutagawa_01", author: "芥川龍之介", work: "侏儒の言葉", year: "1923年", tone: "black",
        text: "古典の作者の幸福なる所以は兎に角彼等の死んでゐることである。"
      },
      {
        id: "fallback_shiki_01", author: "正岡子規", work: "病牀六尺", year: "1902年", tone: "white",
        text: "昨夜少しく睡眠を得て昨朝来の煩悶やや度を減ず、牛乳二杯を飲む。"
      },
      {
        id: "fallback_terada_01", author: "寺田寅彦", work: "科学者とあたま", year: "1933年", tone: "blue",
        text: "頭のいい人は批評家に適するが行為の人にはなりにくい。"
      },
      {
        id: "fallback_rosanjin_01", author: "北大路魯山人", work: "料理の秘訣", year: "1954年", tone: "white",
        text: "料理の材料が悪くては一人前の美味い料理とはならない。"
      },
      {
        id: "fallback_kanoko_01", author: "岡本かの子", work: "小学生のとき与へられた教訓", year: "1936年", tone: "white",
        text: "自分のする事は一つ一つに考慮と全責任を持つた。"
      },
      {
        id: "fallback_kotaro_01", author: "高村光太郎", work: "回想録", year: "1940年", tone: "white",
        text: "私は現在目の前にあるものを尊しと思う。"
      },
      {
        id: "fallback_marcus_01", author: "マルクス・アウレリウス", work: "自省録（独自訳）", year: "西暦2世紀", tone: "blue",
        text: "自分の心を支配できるのは自分だけだ。外の出来事には、その力はない。"
      },
      {
        id: "fallback_nakajima_01", author: "中島敦", work: "和歌でない歌", year: "1942年", tone: "gold",
        text: "ある時は西行がごと家をすて道を求めてさすらはむ心"
      },
      {
        id: "fallback_nietzsche_01", author: "フリードリヒ・ニーチェ", work: "ツァラトゥストラ（独自訳）", year: "1885年", tone: "black",
        text: "踊る星を生むためには、自分の中に混沌を持っていなければならない。"
      }
    ];

    let masterData = fallbackData;

    // 3. 基本UI要素と状態
    const themeBtn = document.getElementById('themeBtn');
    const themeMeta = document.getElementById('theme-color-meta');
    const feedElem = document.getElementById('postFeed');
    const tabFeed = document.getElementById('tabFeed');
    const tabLikes = document.getElementById('tabLikes');
    const pullIndicator = document.getElementById('pull-indicator');
    const brandRefreshBtn = document.getElementById('brandRefreshBtn');

    let currentTab = 'feed';
    let likedPostIds = new Set();
    let authorAffinities = {};

    try {
      likedPostIds = new Set(JSON.parse(storage.getItem('liked_posts') || '[]'));
      authorAffinities = JSON.parse(storage.getItem('author_affinities') || '{}');
    } catch (e) {
      likedPostIds = new Set();
      authorAffinities = {};
    }

    // テーマ切り替え
    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        if (themeMeta) themeMeta.setAttribute('content', '#ffffff');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (themeMeta) themeMeta.setAttribute('content', '#000000');
      }
    });

    // 4. 重み付き推薦ロジック
    const toneWeights = { white: 35, black: 20, blue: 15, gold: 30 };
    const recentPostIds = [];
    const recentTones = [];
    const recentAuthors = [];

    function pickTone() {
      const adjusted = Object.entries(toneWeights).map(([tone, weight]) => ({
        tone,
        weight: recentTones.includes(tone) ? weight * 0.25 : weight
      }));
      let random = Math.random() * adjusted.reduce((sum, item) => sum + item.weight, 0);
      for (const item of adjusted) {
        if (random < item.weight) return item.tone;
        random -= item.weight;
      }
      return 'white';
    }

    function pickNextItem() {
      const desiredTone = pickTone();
      let candidates = masterData.filter(item =>
        (item.tone || 'white') === desiredTone && !recentPostIds.includes(item.id)
      );
      if (candidates.length === 0) {
        candidates = masterData.filter(item => !recentPostIds.includes(item.id));
      }
      if (candidates.length === 0) candidates = masterData;

      const freshAuthors = candidates.filter(item => !recentAuthors.includes(item.author));
      if (freshAuthors.length > 0) candidates = freshAuthors;

      // 断片数の多い作家だけが有利にならないよう、先に作家を選んでから一篇を選ぶ。
      const candidateAuthors = Array.from(new Set(candidates.map(item => item.author)));
      let totalWeight = 0;
      const weights = candidateAuthors.map(author => {
        const affinity = authorAffinities[author] || 0;
        const weight = 1.0 + Math.min(affinity, 8) * 0.4;
        totalWeight += weight;
        return weight;
      });

      let random = Math.random() * totalWeight;
      let pickedAuthor = candidateAuthors[candidateAuthors.length - 1];
      for (let i = 0; i < candidateAuthors.length; i++) {
        if (random < weights[i]) {
          pickedAuthor = candidateAuthors[i];
          break;
        }
        random -= weights[i];
      }
      const authorCandidates = candidates.filter(item => item.author === pickedAuthor);
      const picked = authorCandidates[Math.floor(Math.random() * authorCandidates.length)];
      recentPostIds.push(picked.id);
      if (recentPostIds.length > 40) recentPostIds.shift();
      recentTones.push(picked.tone || 'white');
      if (recentTones.length > 2) recentTones.shift();
      recentAuthors.push(picked.author);
      if (recentAuthors.length > 6) recentAuthors.shift();
      return picked;
    }

    // 5. 滞留時間の観測
    let dwellTimers = new Map();
    let observer = null;
    if ('IntersectionObserver' in window) {
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const author = entry.target.dataset.author;
          if (!author) return;

          if (entry.isIntersecting) {
            const timer = setTimeout(() => {
              authorAffinities[author] = (authorAffinities[author] || 0) + 1;
              storage.setItem('author_affinities', JSON.stringify(authorAffinities));
            }, 1500);
            dwellTimers.set(entry.target, timer);
          } else {
            if (dwellTimers.has(entry.target)) {
              clearTimeout(dwellTimers.get(entry.target));
              dwellTimers.delete(entry.target);
            }
          }
        });
      }, { threshold: 0.6 });
    }

    // 6. ポスト要素の生成
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    function stripOuterQuote(text) {
      const pairs = { '「': '」', '『': '』' };
      const opening = text[0];
      const closing = pairs[opening];
      if (!closing || !text.endsWith(closing)) return text;
      let depth = 0;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === opening) depth++;
        if (text[i] === closing) {
          depth--;
          if (depth === 0 && i !== text.length - 1) return text;
        }
      }
      return depth === 0 ? text.slice(1, -1).trim() : text;
    }

    const authorAvatars = {
      '芥川龍之介': './avatars/akutagawa-ryunosuke.jpg',
      '石川啄木': './avatars/ishikawa-takuboku.jpg',
      '尾崎放哉': './avatars/ozaki-hosai.jpg',
      '種田山頭火': './avatars/taneda-santoka.jpg',
      '寺田寅彦': './avatars/terada-torahiko.jpg',
      '正岡子規': './avatars/masaoka-shiki.jpg',
      '北大路魯山人': './avatars/kitaoji-rosanjin.jpg',
      '岡本かの子': './avatars/okamoto-kanoko.jpg',
      '高村光太郎': './avatars/takamura-kotaro.jpg',
      '下村湖人': './avatars/shimomura-kojin.jpg',
      '中島敦': './avatars/nakajima-atsushi.jpg',
      '中原中也': './avatars/nakahara-chuya.jpg',
      '萩原朔太郎': './avatars/hagiwara-sakutaro.jpg',
      '宮沢賢治': './avatars/miyazawa-kenji.jpg',
      '与謝野晶子': './avatars/yosano-akiko.jpg',
      '北原白秋': './avatars/kitahara-hakushu.jpg',
      '八木重吉': './avatars/yagi-jukichi.jpg',
      'マルクス・アウレリウス': './avatars/marcus-aurelius.jpg',
      'フリードリヒ・ニーチェ': './avatars/friedrich-nietzsche.jpg',
      'フランツ・カフカ': './avatars/franz-kafka.jpg',
      'エピクテトス': './avatars/epictetus.png'
    };

    function createPostNode(item) {
      const isLiked = likedPostIds.has(item.id);
      const displayText = stripOuterQuote(item.text);
      const avatar = authorAvatars[item.author];
      const article = document.createElement('article');
      article.className = 'post';
      article.dataset.author = item.author;
      article.dataset.id = item.id;

      article.innerHTML = `
        <div class="post-avatar">${avatar ? `<img src="${avatar}" alt="" loading="lazy">` : escapeHTML(item.author[0])}</div>
        <div class="post-content">
          <div class="post-meta">
            <span class="author-name">${escapeHTML(item.author)}</span>
            <span class="work-handle">@${escapeHTML(item.work)}</span>
            <span class="meta-dot">·</span>
            <span class="post-time">${escapeHTML(item.year || '')}</span>
          </div>
          <div class="post-body">${escapeHTML(displayText)}</div>
          <div class="post-actions">
            <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" aria-label="いいね">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
            <button class="action-btn share-btn" aria-label="共有">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                <polyline points="16 6 12 2 8 6"></polyline>
                <line x1="12" y1="2" x2="12" y2="15"></line>
              </svg>
            </button>
          </div>
        </div>
      `;

      // いいね処理
      const likeBtn = article.querySelector('.like-btn');
      likeBtn.addEventListener('click', () => {
        if (likedPostIds.has(item.id)) {
          likedPostIds.delete(item.id);
          likeBtn.classList.remove('liked');
          if (currentTab === 'likes') {
            article.remove();
            checkEmptyLikes();
          }
        } else {
          likedPostIds.add(item.id);
          likeBtn.classList.add('liked');
          authorAffinities[item.author] = (authorAffinities[item.author] || 0) + 3;
          storage.setItem('author_affinities', JSON.stringify(authorAffinities));
        }
        storage.setItem('liked_posts', JSON.stringify(Array.from(likedPostIds)));
      });

      // 共有処理（OSネイティブ共有優先、フォールバックでXの投稿画面を開く）
      const shareBtn = article.querySelector('.share-btn');
      shareBtn.addEventListener('click', async () => {
        const shareText = `${displayText}\n\n―― ${item.author} @${item.work}`;
        const currentUrl = window.location.href.split('#')[0];

        if (navigator.share) {
          try {
            await navigator.share({
              text: shareText,
              url: currentUrl
            });
            return;
          } catch (e) {
            // キャンセル等は無視してフォールバック
          }
        }

        const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(currentUrl)}`;
        window.open(tweetUrl, '_blank', 'noopener,noreferrer');
      });

      if (observer) observer.observe(article);
      return article;
    }

    function checkEmptyLikes() {
      if (feedElem.children.length === 0) {
        feedElem.innerHTML = `<div class="empty-state">まだ保存された言葉はありません。<br>タイムラインでハートを押すとここに蓄積されます。</div>`;
      }
    }

    function appendFeedPosts(count = 6) {
      for (let i = 0; i < count; i++) {
        const item = pickNextItem();
        feedElem.appendChild(createPostNode(item));
      }
    }

    function refreshTimeline() {
      if (currentTab !== 'feed') {
        currentTab = 'feed';
        tabFeed.classList.add('active');
        tabLikes.classList.remove('active');
      }
      feedElem.innerHTML = '';
      appendFeedPosts(8);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    brandRefreshBtn.addEventListener('click', refreshTimeline);

    function renderLikes() {
      feedElem.innerHTML = '';
      const likedItems = masterData.filter(d => likedPostIds.has(d.id));
      if (likedItems.length === 0) {
        checkEmptyLikes();
        return;
      }
      likedItems.forEach(item => {
        feedElem.appendChild(createPostNode(item));
      });
    }

    // タブ切り替え
    tabFeed.addEventListener('click', refreshTimeline);

    tabLikes.addEventListener('click', () => {
      if (currentTab === 'likes') return;
      currentTab = 'likes';
      tabLikes.classList.add('active');
      tabFeed.classList.remove('active');
      renderLikes();
    });

    // 無限スクロール
    window.addEventListener('scroll', () => {
      if (currentTab !== 'feed') return;
      const scrollHeight = document.documentElement.scrollHeight;
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const clientHeight = window.innerHeight;

      if (scrollTop + clientHeight >= scrollHeight - 600) {
        appendFeedPosts(4);
      }
    }, { passive: true });

    // 引っ張って更新
    let touchStartY = 0;
    let isPulling = false;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        touchStartY = e.touches[0].clientY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling || currentTab !== 'feed') return;
      const currentY = e.touches[0].clientY;
      const diff = currentY - touchStartY;

      if (diff > 0 && window.scrollY === 0) {
        const height = Math.min(diff * 0.4, 56);
        pullIndicator.style.height = `${height}px`;
        pullIndicator.textContent = height > 40 ? '離して更新' : '引っ張って更新';
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isPulling) return;
      isPulling = false;
      const height = parseInt(pullIndicator.style.height || '0');
      if (height > 40) {
        pullIndicator.textContent = '更新中...';
        setTimeout(() => {
          refreshTimeline();
          pullIndicator.style.height = '0px';
        }, 400);
      } else {
        pullIndicator.style.height = '0px';
      }
    });

    // 外部JSON読み込み（存在しない場合はフォールバックのまま動作）
    async function init() {
      try {
        const res = await fetch('./quotes.json');
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            masterData = json;
          }
        }
      } catch (e) {
        // quotes.json がない環境では fallbackData を維持
      }
      appendFeedPosts(8);
    }

    init();
  </script>
</body>
</html>
